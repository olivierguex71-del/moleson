name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: moleson
          POSTGRES_USER: moleson
          POSTGRES_PASSWORD: moleson
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moleson"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: cle-de-test-sans-valeur
      DJANGO_DEBUG: "true"
      DATABASE_URL: postgres://moleson:moleson@localhost:5432/moleson

    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système de WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libfribidi0 \
            libgdk-pixbuf-2.0-0 shared-mime-info fonts-dejavu-core

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync

      - name: Aucune migration en attente
        # Détecte un modèle modifié sans migration correspondante — la panne
        # classique quand on travaille sur plusieurs machines.
        run: uv run python manage.py makemigrations --check --dry-run

      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing

  image:
    name: Image de production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
